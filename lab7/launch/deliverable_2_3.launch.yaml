launch:

    - arg:
        name: max_solver_iterations
        default: "1"
    - arg:
        name: use_mocap
        default: "false"
    # RViz2 cannot create an OpenGL window through XQuartz on macOS; there use
    # rviz:=false foxglove:=true and open https://app.foxglove.dev (ws://localhost:8765).
    - arg:
        name: rviz
        default: "true"
    - arg:
        name: foxglove
        default: "false"

    - node:
        pkg: lab_7
        exec: deliverable_2_3
        name: deliverable_2_3
        output: screen
        param:
            - name: "max_solver_iterations"
              value: "$(var max_solver_iterations)"
            - name: "use_mocap"
              value: "$(var use_mocap)"

    - node:
        if: "$(var rviz)"
        pkg: rviz2
        exec: rviz2
        name: rviz2
        args: "-d $(find-pkg-share lab_7)/rviz/lab7.rviz"

    - node:
        if: "$(var foxglove)"
        pkg: foxglove_bridge
        exec: foxglove_bridge
        name: foxglove_bridge
